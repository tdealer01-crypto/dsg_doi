<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Initiative Readiness Gate</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1ea;color:#111;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:auto;padding:56px 24px 32px}.hero{max-width:820px;margin-bottom:38px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:800;margin:0 0 12px}h1{font-size:clamp(40px,7vw,78px);line-height:.94;letter-spacing:-.055em;margin:0}.lede{font-size:20px;line-height:1.5;max-width:740px;margin:24px 0 10px;color:#343434}.privacy{font-size:13px;color:#666;margin:0}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.8fr);gap:22px;align-items:start}.questions,.result{border:1px solid #111;background:#fff;box-shadow:7px 7px 0 #111}.question{padding:22px;border-bottom:1px solid #c9c5bb;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.question:last-child{border-bottom:0}.number{font-size:11px;font-weight:800;color:#777}.question h2{font-size:19px;margin:4px 0 5px}.question p{margin:0;font-size:14px;color:#606060;line-height:1.4}.toggle{display:flex;border:1px solid #111}.toggle button{border:0;background:#fff;padding:10px 14px;min-width:56px;cursor:pointer;font:inherit}.toggle button+button{border-left:1px solid #111}.toggle button.active{background:#111;color:#fff}.result{padding:26px;position:sticky;top:18px}.result.go{border-top:8px solid #26834a}.result.review{border-top:8px solid #d49216}.result.hold{border-top:8px solid #c94131}.decision{font-size:64px;line-height:1;font-weight:900;letter-spacing:-.06em;margin:6px 0 8px}.summary{font-size:17px;margin:0 0 28px}.block{border-top:1px solid #d4d0c7;padding-top:18px;margin-top:18px}.block h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;margin:0 0 9px}ul{padding-left:20px;margin:0}li{margin:8px 0;line-height:1.42;color:#333}.copy{margin-top:22px;width:100%;border:1px solid #111;background:#111;color:#fff;padding:13px 16px;font-weight:800;cursor:pointer}.copy-status{min-height:18px;margin:8px 0 0;font-size:12px;color:#555}footer{padding:34px 0 0;font-size:13px;line-height:1.5;color:#666;max-width:760px}@media(max-width:800px){.shell{padding-top:34px}.grid{grid-template-columns:1fr}.result{position:static}.question{grid-template-columns:1fr}.toggle{width:100%}.toggle button{flex:1}h1{font-size:clamp(42px,14vw,66px)}}
</style>
</head>
<body>
<main class="shell" id="app"></main>
<script>
const state={scope:'yes',production:'no',review:'yes',fallback:'yes',evidence:'yes'};
const qs=[
['scope','Is the operating scope explicit?','The team can state what the AI may do, where it may run, and what is out of scope.'],
['production','Can outputs directly affect a live workflow?','The result can move from suggestion to real business use without an extra staging step.'],
['review','Is there a human checkpoint for high-impact outcomes?','A named owner can review consequential outcomes before they take effect.'],
['fallback','Is there a safe fallback path?','The workflow can return to a manual or previous process when confidence drops.'],
['evidence','Are decisions and outcomes traceable?','The team can inspect what happened and why after a run.']
];
function evaluate(){let risk=0,reasons=[],next=[];
if(state.scope==='no'){risk+=2;reasons.push('The operating boundary is not explicit.');next.push('Write a one-page scope contract: allowed actions, excluded actions, and owner.')}
if(state.production==='yes'){risk+=2;reasons.push('Outputs can affect a live workflow.');next.push('Use staged rollout and keep a clear owner for production-impacting outcomes.')}
if(state.review==='no'){risk+=2;reasons.push('High-impact outcomes lack a human checkpoint.');next.push('Add a human review point before consequential outcomes take effect.')}
if(state.fallback==='no'){risk+=2;reasons.push('There is no safe fallback when the workflow is uncertain.');next.push('Define a manual or previous-process fallback before wider rollout.')}
if(state.evidence==='no'){risk+=1;reasons.push('The team cannot easily reconstruct what happened after a run.');next.push('Capture structured inputs, outputs, decisions, and outcome evidence.')}
const hard=(state.production==='yes'&&state.review==='no')||(state.production==='yes'&&state.fallback==='no');
const decision=hard||risk>=7?'HOLD':risk>=3?'REVIEW':'GO';
if(!reasons.length)reasons.push('Core delivery safeguards are present and no high-risk condition is flagged.');
if(!next.length)next.push('Keep scope, human ownership, fallback, and evidence checks in place as the system evolves.');
return{decision,reasons,next}}
function render(){const r=evaluate();document.getElementById('app').innerHTML=`<section class="hero"><p class="eyebrow">ctaio.dev field tool</p><h1>AI Initiative Readiness Gate</h1><p class="lede">A 60-second pre-flight check for leaders deciding whether an AI initiative is ready to proceed, needs targeted review, or needs stronger safeguards first.</p><p class="privacy">Runs entirely in your browser. No answers are sent anywhere.</p></section><section class="grid"><div class="questions">${qs.map((q,i)=>`<article class="question"><div><span class="number">0${i+1}</span><h2>${q[1]}</h2><p>${q[2]}</p></div><div class="toggle"><button data-k="${q[0]}" data-v="yes" class="${state[q[0]]==='yes'?'active':''}">Yes</button><button data-k="${q[0]}" data-v="no" class="${state[q[0]]==='no'?'active':''}">No</button></div></article>`).join('')}</div><aside class="result ${r.decision.toLowerCase()}"><p class="eyebrow">Decision</p><div class="decision">${r.decision}</div><p class="summary">${r.decision==='GO'?'Proceed with controlled delivery.':r.decision==='REVIEW'?'Proceed after targeted review.':'Strengthen safeguards before rollout.'}</p><div class="block"><h3>Why</h3><ul>${r.reasons.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="block"><h3>Next safeguards</h3><ul>${r.next.map(x=>`<li>${x}</li>`).join('')}</ul></div><button class="copy" id="copy">Copy decision brief</button><p class="copy-status" id="status"></p></aside></section><footer>Decision aid, not a certification. The goal is to surface delivery risk before broad rollout.</footer>`;document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{state[b.dataset.k]=b.dataset.v;render()});document.getElementById('copy').onclick=async()=>{const text=`AI Initiative Gate: ${r.decision}\nWhy: ${r.reasons.join(' ')}\nNext: ${r.next.join(' ')}`;try{await navigator.clipboard.writeText(text);document.getElementById('status').textContent='Decision brief copied.'}catch(e){document.getElementById('status').textContent='Copy unavailable in this browser.'}}}
render();
</script>
</body>
</html>
